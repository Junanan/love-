<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>给温前玲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #EAF4FB 0%, #FFF9F0 100%);
    color: #3A4A5A;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  /* 漂浮装饰 */
  .floater { position: fixed; opacity: .35; pointer-events: none; z-index: 0; animation: drift linear infinite; }
  @keyframes drift {
    0% { transform: translateY(105vh) rotate(0deg); }
    100% { transform: translateY(-15vh) rotate(360deg); }
  }
  .tomato { width: 22px; height: 22px; border-radius: 50%; background: #F2705B; position: fixed; opacity: .3; }
  .tomato::before { content: ""; position: absolute; top: -6px; left: 8px; width: 8px; height: 7px; background: #7FBF7F; border-radius: 50% 50% 0 0; }
  /* 顶部进度 */
  .progress-wrap { width: 100%; max-width: 420px; padding: 18px 24px 0; z-index: 2; }
  .progress-text { font-size: 12px; color: #8AA3B8; text-align: center; margin-bottom: 8px; letter-spacing: 1px; }
  .progress-bar { height: 4px; background: rgba(127,184,232,.25); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #7FB8E8; border-radius: 2px; transition: width .4s ease; }
  /* 卡片 */
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; padding: 12px 0; }
  .card {
    width: 84%; max-width: 420px; background: #fff; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(100,150,200,.12);
    padding: 36px 28px 32px; text-align: center;
    transition: transform .3s ease, opacity .3s ease;
  }
  .card.slide-out { transform: translateX(-40px); opacity: 0; }
  .card.slide-in { animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .emoji { font-size: 40px; margin-bottom: 18px; }
  .text { font-size: 18px; line-height: 1.7; white-space: pre-line; }
  .text.big { font-size: 28px; letter-spacing: 4px; font-weight: 600; }
  .code {
    margin-top: 22px; background: #2B3440; border-radius: 10px;
    padding: 14px 16px; text-align: left;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 13px; color: #9FD8FF; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
  /* 按钮区 */
  .actions { width: 100%; max-width: 420px; padding: 0 24px calc(24px + env(safe-area-inset-bottom)); z-index: 2; text-align: center; }
  .btn {
    background: #7FB8E8; color: #fff; border: none; border-radius: 999px;
    font-size: 16px; padding: 13px 52px; letter-spacing: 4px;
    box-shadow: 0 6px 16px rgba(127,184,232,.4);
  }
  .btn:active { transform: scale(.96); }
  .btn-yes { font-size: 19px; padding: 15px 64px; animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .hint { margin-top: 12px; font-size: 12px; color: #A9BCCB; }
  /* 第14卡结果 */
  .result { display: none; }
  .result .ok-title { font-size: 22px; font-weight: 600; margin-bottom: 14px; }
  .result .ok-date { font-size: 15px; color: #8AA3B8; margin-bottom: 6px; }
  .result .ok-day { font-size: 15px; color: #8AA3B8; margin-bottom: 18px; }
  .result .ok-counter { font-size: 17px; color: #3A4A5A; }
  .celebration { position: fixed; bottom: -30px; z-index: 5; pointer-events: none; animation: riseUp linear forwards; }
  @keyframes riseUp {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-text" id="progressText">告白进度 1 / 14</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:7.14%"></div></div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="emoji" id="cardEmoji">💌</div>
    <div class="text" id="cardText"></div>
    <div class="code" id="cardCode"></div>
    <div class="result" id="result">
      <div class="ok-title">协议生效</div>
      <div class="ok-date">2026年11月15日</div>
      <div class="ok-day" id="okDay">在一起的第 1 天</div>
      <div class="ok-counter" id="okCounter">我们已经在一起 1 天</div>
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn" id="nextBtn">下一句</button>
  <div class="hint" id="hint">还有 13 句没说</div>
</div>

<script>
var cards = [
  { emoji: "💌", text: "给温前玲", code: "// 这个页面只有一个观众" },
  { emoji: "😊", text: "你的笑容和眼睛，\n比我写过的所有代码都好看。", code: "// 审美这件事上，不存在bug" },
  { emoji: "💻", text: "遇到你之前，我的生活是单线程的。", code: "single_thread = true; // 已废弃" },
  { emoji: "📱", text: "你的消息提示音，是我一天中最期待的声音。", code: "notification.priority = MAX_INT;" },
  { emoji: "🐬", text: "有个人看海豚表演，\n会心疼它们吃得少、还要一直表演。", code: "soft_heart = true;" },
  { emoji: "🎮", text: "她玩游戏输了会耍赖。", code: "// 但我从来没赢过（不敢" },
  { emoji: "🌧️", text: "下雨天，我会担心你有没有带伞。", code: "if (weather.rain) { worry(about: 'you'); }" },
  { emoji: "📖", text: "我正在学习让你开心的方法。\n你开心的时候会连发一串“哈哈”，\n不开心的时候会突然安静。\n我在学：你哈哈的时候陪你哈哈，\n你安静的时候，陪你安静。", code: "learning(you).every(day); // 终身课程，不退学" },
  { emoji: "🍜", text: "想和你一起吃很多顿饭，从老三样到DQ。", code: "food.list.push('和你一起吃的一切');" },
  { emoji: "🛏️", text: "她睡觉要抱着东西，还要人拍背。", code: "// 这个岗位我申请了，长期有效" },
  { emoji: "🌊", text: "她说，不可以随便拉女生的手，拥抱也是。\n所以10月31日那次，我牵得很认真；\n11月8日，河边的拥抱，风可以作证。", code: "// 每一步，都走得很认真" },
  { emoji: "📜", text: "她说，我们之间少了一个正式的什么。", code: "// 于是有了这个页面" },
  { emoji: "", text: "温前玲", code: "", big: true },
  { emoji: "", text: "做我女朋友吧。", code: "", final: true }
];

var idx = 0;
var cardEl = document.getElementById('card');
var emojiEl = document.getElementById('cardEmoji');
var textEl = document.getElementById('cardText');
var codeEl = document.getElementById('cardCode');
var resultEl = document.getElementById('result');
var nextBtn = document.getElementById('nextBtn');
var hintEl = document.getElementById('hint');
var progressText = document.getElementById('progressText');
var progressFill = document.getElementById('progressFill');
var agreed = false;

function render() {
  var c = cards[idx];
  emojiEl.textContent = c.emoji;
  emojiEl.style.display = c.emoji ? 'block' : 'none';
  textEl.textContent = c.text;
  textEl.className = c.big ? 'text big' : 'text';
  codeEl.textContent = c.code || '';
  codeEl.style.display = c.code ? 'block' : 'none';
  resultEl.style.display = 'none';
  progressText.textContent = '告白进度 ' + (idx + 1) + ' / 14';
  progressFill.style.width = ((idx + 1) / 14 * 100) + '%';
  if (c.final) {
    nextBtn.textContent = '好';
    nextBtn.className = 'btn btn-yes';
    hintEl.style.display = 'none';
  } else {
    nextBtn.textContent = '下一句';
    nextBtn.className = 'btn';
    hintEl.style.display = 'block';
    hintEl.textContent = '还有 ' + (13 - idx) + ' 句没说';
  }
}

function dayCount() {
  // 以东八区日期计算：2026-11-15 为第 1 天
  var nowUtc8 = new Date(Date.now() + 8 * 3600 * 1000);
  var todayUtc8 = Date.UTC(nowUtc8.getUTCFullYear(), nowUtc8.getUTCMonth(), nowUtc8.getUTCDate());
  var startUtc8 = Date.UTC(2026, 10, 15);
  var days = Math.floor((todayUtc8 - startUtc8) / 86400000) + 1;
  return days < 1 ? 1 : days;
}

function celebrate() {
  var icons = ['🍅', '⭐', '✦', '☁️'];
  for (var i = 0; i < 18; i++) {
    (function (i) {
      setTimeout(function () {
        var s = document.createElement('span');
        s.className = 'celebration';
        s.textContent = icons[Math.floor(Math.random() * icons.length)];
        s.style.left = (Math.random() * 90 + 5) + 'vw';
        s.style.fontSize = (Math.random() * 14 + 14) + 'px';
        s.style.animationDuration = (Math.random() * 1.5 + 1.8) + 's';
        document.body.appendChild(s);
        setTimeout(function () { s.remove(); }, 3500);
      }, i * 120);
    })(i);
  }
}

nextBtn.addEventListener('click', function () {
  if (agreed) return;
  var c = cards[idx];
  if (c.final) {
    agreed = true;
    nextBtn.style.display = 'none';
    textEl.style.display = 'none';
    emojiEl.style.display = 'none';
    resultEl.style.display = 'block';
    var d = dayCount();
    document.getElementById('okDay').textContent = '在一起的第 ' + d + ' 天';
    document.getElementById('okCounter').textContent = '我们已经在一起 ' + d + ' 天';
    setInterval(function () {
      var dd = dayCount();
      document.getElementById('okDay').textContent = '在一起的第 ' + dd + ' 天';
      document.getElementById('okCounter').textContent = '我们已经在一起 ' + dd + ' 天';
    }, 60000);
    celebrate();
    return;
  }
  cardEl.classList.add('slide-out');
  setTimeout(function () {
    idx++;
    cardEl.classList.remove('slide-out');
    render();
    cardEl.classList.add('slide-in');
    setTimeout(function () { cardEl.classList.remove('slide-in'); }, 320);
  }, 300);
});

// 漂浮装饰物
(function () {
  var marks = ['✦', '☁️', '⭐'];
  for (var i = 0; i < 8; i++) {
    var s = document.createElement('span');
    s.className = 'floater';
    s.textContent = marks[i % marks.length];
    s.style.left = (Math.random() * 92) + 'vw';
    s.style.fontSize = (Math.random() * 12 + 12) + 'px';
    s.style.animationDuration = (Math.random() * 12 + 20) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    document.body.appendChild(s);
  }
  for (var j = 0; j < 4; j++) {
    var t = document.createElement('div');
    t.className = 'floater tomato';
    t.style.left = (Math.random() * 92) + 'vw';
    t.style.animationDuration = (Math.random() * 10 + 22) + 's';
    t.style.animationDelay = (-Math.random() * 20) + 's';
    document.body.appendChild(t);
  }
})();

render();
</script>
</body>
</html>
